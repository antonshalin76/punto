# Punto Switcher Configuration
# Путь по умолчанию: /etc/punto/config.yaml
# Config version: 2.8.14

# Физическая комбинация смены источника, события которой EventLoop распознаёт
# как смену пользовательского контекста. Она должна совпадать с binding GNOME.
# Исправления запрашивают нужный EN/RU источник через защищённый session bridge;
# daemon не синтезирует эту комбинацию и не изменяет binding самостоятельно.
hotkey:
  modifier: leftctrl
  key: grave

# Автоматическое исправление слова при нажатии пробела/таба.
# Анализ: словарь (приоритет) + N-граммы только для слов, которые есть в обоих словарях
# (если слова нет в словарях — раскладка не меняется)
auto_switch:
  enabled: true                     # Начальное состояние автокоррекции
  threshold: 3.5
  min_word_len: 2
  min_score: 5.0
  max_rollback_words: 5

  # Исправление опечаток (v2.7+)
  typo_correction_enabled: false     # Перестановки, замены, пропуски, дубли
  max_typo_diff: 2                  # Максимальное расстояние редактирования (1-2)
  sticky_shift_correction_enabled: true  # Распознавание залипшего Shift (ПРивет)

# Звук завершённого переключения раскладки.
sound:
  enabled: true

# Логирование демона (syslog/journald)
logging:
  level: info   # error, warning, info, debug

# Runtime budget для многоклавиатурной схемы udevmon.
# Каждый punto-daemon получает долю worker threads по снимку числа процессов
# при старте. После hotplug/hot-unplug перезапустите udevmon для пересчёта.
runtime:
  analysis_threads: 0              # 0 = auto-budget, >0 = жёсткий override на процесс
  max_analysis_threads_per_daemon: 4
