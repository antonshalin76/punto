# Punto Switcher Configuration
# Путь по умолчанию: /etc/punto/config.yaml
# Config version: 2.8.7

# Поле совместимости со старыми конфигами. Runtime v2.8.7 его принимает и
# сохраняет, но не наблюдает и не применяет: системный hotkey настраивается
# только средствами desktop environment.
hotkey:
  modifier: leftctrl
  key: grave

# Анализ слова при нажатии пробела/таба. В безопасном режиме v2.8.7
# решения не изменяют текст или раскладку.
# Анализ: словарь (приоритет) + N-граммы только для слов, которые есть в обоих словарях
# (если слова нет в словарях — раскладка не меняется)
auto_switch:
  enabled: true                     # Включить анализ; не включает изменение текста
  threshold: 3.5
  min_word_len: 2
  min_score: 5.0
  max_rollback_words: 5

  # Классификация опечаток (v2.7+); в v2.8.7 без изменения текста
  typo_correction_enabled: false     # Перестановки, замены, пропуски, дубли
  max_typo_diff: 2                  # Максимальное расстояние редактирования (1-2)
  sticky_shift_correction_enabled: true  # Распознавание залипшего Shift (ПРивет)

# Сохранено для совместимости. В безопасном режиме v2.8.7 звук исправлений
# не воспроизводится, потому что изменения текста и раскладки не применяются.
sound:
  enabled: true

# Логирование демона (syslog/journald)
logging:
  level: info   # error, warning, info, debug

# Runtime budget для многоклавиатурной схемы udevmon.
# Каждый punto-daemon получает только свою долю worker threads,
# чтобы суммарный пул не рос линейно от числа клавиатур.
runtime:
  analysis_threads: 0              # 0 = auto-budget, >0 = жёсткий override на процесс
  max_analysis_threads_per_daemon: 4
